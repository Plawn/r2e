[package]
name = "r2e-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "model-context-protocol", "web", "framework"]
categories = ["web-programming"]
description = "MCP (Model Context Protocol) server support for R2E framework"

[features]
default = []
# Test helpers (`r2e_mcp::testing`): pin a TestJwt-backed validator so an
# authenticated MCP app boots with zero network I/O.
testing = ["dep:r2e-test"]

[dependencies]
r2e-core = { workspace = true }
# OAuth resource-server layer (mcp.auth.*): JWT validation, JWKS cache,
# role extractors and the shared OAuth HTTP client all come from r2e-security.
r2e-security = { workspace = true }
# `testing` feature only — no cycle: r2e-test does not depend on r2e-mcp.
r2e-test = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
url = { workspace = true }
# Reverse-matching RFC 6570 resource templates: captured variables are
# percent-decoded before reaching `ResourceCall::variables`.
percent-encoding = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
# `default-features = false`: rmcp's default `macros` feature is deliberately
# unused — R2E dispatches tools itself (#[mcp_routes]), rmcp is the wire only.
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# TestJwt: offline HS256 tokens for the auth target (the `testing` feature's
# `pin_mcp_validator` additionally needs `--features testing`).
r2e-test = { workspace = true }
# Test-harness runtime deps — dev-deps are exempt from the tokio dep-boundary
# check (r2e-grpc/r2e-prometheus precedent).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
# End-to-end auth against a real Keycloak (Docker-gated `#[ignore]` tests).
r2e-devservices = { workspace = true, features = ["keycloak"] }
