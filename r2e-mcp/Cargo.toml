[package]
name = "r2e-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "model-context-protocol", "web", "framework"]
categories = ["web-programming"]
description = "MCP (Model Context Protocol) server support for R2E framework"

[features]
default = []

[dependencies]
r2e-core = { workspace = true }
# OAuth resource-server layer (mcp.auth.*): JWT validation, JWKS cache,
# role extractors and the shared OAuth HTTP client all come from r2e-security.
r2e-security = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
url = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
# `default-features = false`: rmcp's default `macros` feature is deliberately
# unused — R2E dispatches tools itself (#[mcp_routes]), rmcp is the wire only.
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The attribute macros under test (`#[controller]` + `#[mcp_routes]`/`#[tool]`);
# the macro's default crate path `::r2e_mcp` resolves correctly inside this
# crate's own integration tests.
r2e-macros = { workspace = true }
# Test-harness runtime deps — dev-deps are exempt from the tokio dep-boundary
# check (r2e-grpc/r2e-prometheus precedent).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
