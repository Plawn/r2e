[package]
name = "r2e-mcp"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "llm", "web", "framework"]
categories = ["web-programming"]
description = "MCP (Model Context Protocol) server support for R2E framework"

[features]
default = []
# Test helpers (`r2e_mcp::testing`): `app.mcp()` — an in-process MCP client
# over the loopback transport — and `pin_mcp_validator`, a TestJwt-backed
# validator so an authenticated MCP app boots with zero network I/O.
testing = ["dep:r2e-test", "loopback"]
# In-process (loopback) transport (`r2e_mcp::loopback::McpLoopback`): open
# MCP sessions on the mounted endpoint without the network stack. rmcp's
# `client` role only adds `tokio-stream`, already in the graph — no new crate.
loopback = ["rmcp/client", "dep:futures-util", "dep:futures-channel"]

[dependencies]
r2e-core = { workspace = true }
# Only for the adapter implementing rmcp's `#[async_trait] SessionStore`.
async-trait = { workspace = true }
# OAuth resource-server layer (mcp.auth.*): JWT validation, JWKS cache,
# role extractors and the shared OAuth HTTP client all come from r2e-security.
r2e-security = { workspace = true }
# `testing` feature only — no cycle: r2e-test does not depend on r2e-mcp.
r2e-test = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
# HTTP Basic auth (mcp.auth.basic.*): credential decoding + constant-time compare.
base64 = { workspace = true }
subtle = { workspace = true }
url = { workspace = true }
# Reverse-matching RFC 6570 resource templates: captured variables are
# percent-decoded before reaching `ResourceCall::variables`.
percent-encoding = { workspace = true }
tower = { workspace = true }
# `Body::size_hint` — the MCP request log peeks the JSON-RPC method only of a
# body whose exact length is known and within the transport limit.
http-body = { workspace = true }
# `default-features = false`: rmcp's default `macros` feature is deliberately
# unused — R2E dispatches tools itself (#[routes] MCP members), rmcp is the wire only.
# `request-state`: the HMAC codec sealing the MRTR `requestState`.
rmcp = { workspace = true, features = ["request-state"] }
# `loopback` only: the in-memory channels (`Sink` senders) + `StreamExt::map`.
futures-channel = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# TestJwt: offline HS256 tokens for the auth target (the `testing` feature's
# `pin_mcp_validator` additionally needs `--features testing`).
r2e-test = { workspace = true }
# Test-harness runtime deps — dev-deps are exempt from the tokio dep-boundary
# check (r2e-grpc/r2e-prometheus precedent).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
# Thread-local capture of the `HttpTrace` summary line (tests/server/mount.rs).
tracing-subscriber = { workspace = true }
# End-to-end auth against a real Keycloak (Docker-gated `#[ignore]` tests).
r2e-devservices = { workspace = true, features = ["keycloak"] }
