[package]
name = "r2e-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "model-context-protocol", "web", "framework"]
categories = ["web-programming"]
description = "MCP (Model Context Protocol) server support for R2E framework"

[features]
default = []

[dependencies]
r2e-core = { workspace = true }
# `default-features = false`: rmcp's default `macros` feature is deliberately
# unused — R2E dispatches tools itself (#[mcp_routes]), rmcp is the wire only.
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
