[package]
name = "r2e-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["grpc", "tonic", "web", "framework"]
categories = ["web-programming"]
description = "gRPC server support for R2E framework"

[features]
default = []
reflection = ["dep:tonic-reflection"]
# grpc-web translation (`tonic-web`) for the multiplexed transport.
web = ["dep:tonic-web", "dep:tower-http"]

[dependencies]
r2e-core = {workspace = true}
tonic = {workspace = true, features = ["codegen", "router", "server"]}
prost = {workspace = true}
hyper = {workspace = true, features = ["http2", "server"]}
hyper-util = {workspace = true, features = ["server-auto", "tokio"]}
tower = {workspace = true}
http = {workspace = true}
http-body = {workspace = true}
tracing = {workspace = true}
serde_json = {workspace = true}
bytes = {workspace = true}
futures-util = {workspace = true}
pin-project-lite = {workspace = true}

tonic-reflection = {workspace = true, optional = true}
tonic-web = {workspace = true, optional = true}
tower-http = {workspace = true, features = ["cors"], optional = true}

[dev-dependencies]
tokio = {workspace = true, features = ["full"]}
