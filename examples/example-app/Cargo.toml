[package]
name = "example-app"
version.workspace = true
edition.workspace = true
publish = false

[features]
dev-reload = ["r2e/dev-reload"]

[dependencies]
r2e = {workspace = true, features = ["full", "sqlx-sqlite"]}
tower-http = {workspace = true, features = ["timeout"]}
serde = {workspace = true}
serde_json = {workspace = true}
jsonwebtoken = {workspace = true}
sqlx = {workspace = true, features = ["sqlite"]}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
garde = {workspace = true}
schemars = {workspace = true}
dashmap = {workspace = true}
futures-core = {workspace = true}

[dev-dependencies]
r2e-test = {workspace = true, features = ["ws"]}
garde = {workspace = true}
http = {workspace = true}
# tests/hotpath: drives the framework's layer stack in-process with
# `ServiceExt::oneshot`, under a counting global allocator.
tower = {workspace = true, features = ["util"]}
