[package]
name = "example-openfga"
version.workspace = true
edition.workspace = true
publish = false

[features]
dev-reload = ["r2e/dev-reload"]

[dependencies]
r2e = { workspace = true, features = ["security", "openapi"] }
# `r2e-openfga` directly, not via the facade's `openfga` feature: that feature
# is held back from the crates.io release (see `r2e/Cargo.toml`).
r2e-openfga = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
r2e-test = { workspace = true }
r2e-devservices = { workspace = true, features = ["openfga"] }
serde_json = { workspace = true }
