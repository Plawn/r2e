[package]
name = "r2e-compile-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Real tonic-build output for the gRPC fixtures (see src/lib.rs): the
# generated code references `::tonic`, `::tonic_prost`, and `::prost`.
tonic = {workspace = true, default-features = true}
tonic-prost = {workspace = true}
prost = {workspace = true}

[build-dependencies]
r2e-grpc-build = {workspace = true}

[dev-dependencies]
# `tenant-sqlx` (+ a driver) so the per-tenant transaction cases compile.
r2e = {workspace = true, features = ["full", "tenant-sqlx", "sqlx-sqlite"]}
r2e-test = {workspace = true}
sqlx = {workspace = true, features = ["sqlite"]}
bytes = {workspace = true}
schemars = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true, features = ["full"]}
# `#[derive(BackgroundService)]` emits `::tokio_util::sync::CancellationToken`.
tokio-util = {workspace = true}
futures-core = {workspace = true}
futures-util = {workspace = true}
trybuild = {workspace = true}
