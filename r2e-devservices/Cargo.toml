[package]
name = "r2e-devservices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["testing", "testcontainers", "dev-services"]
categories = ["development-tools::testing"]
description = "Dev services for R2E tests - containerized Postgres/Redis started on demand and wired into the test config"

[features]
default = []
postgres = ["testcontainers-modules/postgres"]
redis = ["testcontainers-modules/redis"]
openfga = ["testcontainers/http_wait", "dep:reqwest", "dep:serde_json"]

[dependencies]
# `device-requests` is enabled unconditionally, not passed through a feature of
# our own: it gates `ContainerRequest::device_requests()`, which the sharing
# identity has to read. Behind a feature, a user enabling it on their own
# `testcontainers` dependency would get requests whose GPU reservations are
# invisible to the identity — two different containers sharing one.
testcontainers = { workspace = true, features = [
    "reusable-containers",
    "device-requests",
] }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["postgres"] }
