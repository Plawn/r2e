[package]
name = "r2e-data-diesel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["database", "sql", "diesel", "transaction"]
categories = ["database"]
description = "Cancellation-safe managed Diesel transactions for R2E"

[features]
default = []
sqlite = ["diesel/sqlite"]
postgres = ["diesel/postgres"]
mysql = ["diesel/mysql"]
# Per-tenant pools and transactions (TenantPools/TenantTx/PoolSource).
tenant = ["dep:r2e-tenant"]

[dependencies]
arc-swap = "1"
r2e-core = {workspace = true}
r2e-tenant = {workspace = true, optional = true}
diesel = {workspace = true, features = ["r2d2"]}
diesel_migrations = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
http-body-util = {workspace = true}
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "time"]}
tokio-util = {workspace = true}
tower = {workspace = true, features = ["util"]}
