[package]
name = "r2e-data-sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["database", "sql", "sqlx", "transaction"]
categories = ["database"]
description = "Cancellation-safe managed SQLx transactions for R2E"

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# Per-tenant pools and transactions (TenantPools/TenantTx/PoolSource).
tenant = ["dep:r2e-tenant"]

[dependencies]
arc-swap = "1"
async-stream = "0.3"
futures-core = {workspace = true}
futures-util = {workspace = true}
r2e-core = {workspace = true}
r2e-tenant = {workspace = true, optional = true}
sqlx = {workspace = true}
tokio-util = {workspace = true}

[dev-dependencies]
http-body-util = {workspace = true}
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "time"]}
tower = {workspace = true, features = ["util"]}
