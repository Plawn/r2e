[package]
name = "r2e-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["testing", "http-client", "jwt"]
categories = ["development-tools::testing"]
description = "Test utilities for R2E - TestApp HTTP client and TestJwt token generation"

[features]
default = []
ws = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
# `test-util`: paused clocks for `#[r2e::test(start_paused = true)]`. A test
# harness is exactly the place that may turn it on — it never reaches a
# production build, since r2e-test is a dev-dependency everywhere.
r2e-core = {workspace = true, features = ["test-util"]}
r2e-security = {workspace = true}
tower = {workspace = true, features = ["util"]}
http = {workspace = true}
http-body-util = {workspace = true}
bytes = {workspace = true}
jsonwebtoken = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true, features = ["full"]}
inventory = {workspace = true}
form_urlencoded = {workspace = true}
futures-core = {workspace = true}
tokio-tungstenite = {workspace = true, optional = true}
futures-util = {workspace = true, optional = true}

[dev-dependencies]
base64 = {workspace = true}
# The facade, for the macros only: `tests/suite.rs` drives `#[r2e::test_suite]`
# end-to-end. Dev-only, and `r2e` does not depend on `r2e-test`, so no cycle.
r2e = {workspace = true}
