[package]
name = "r2e-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["http", "web", "axum", "framework"]
categories = ["web-programming::http-server"]
description = "HTTP abstraction layer for R2E - sole owner of the axum dependency"

[features]
default = []
# Alternate JSON codec behind `r2e_http::json` / `Json<T>` (sonic-rs, SIMD).
# Additive: when enabled it takes precedence over the default serde_json
# backend. See plans/json-codec-containment.md §3.3.
json-sonic = ["dep:sonic-rs"]
ws = ["axum/ws"]
multipart = ["axum/multipart"]
quic = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:rustls", "dep:rustls-pemfile", "dep:http-body", "dep:http-body-util", "dep:tower", "dep:tracing", "dep:r2e-rt"]

[dependencies]
axum = {workspace = true}
bytes = {workspace = true}
http = {workspace = true}
serde = {workspace = true}
# The dynamic-tree crate (`Value`, `json!`) and the default codec backend.
# Never optional: `JsonError: From<serde_json::Error>` keeps the `Value`
# paths composing with the façade (plans/json-codec-containment.md §1.3).
serde_json = {workspace = true}
sonic-rs = {workspace = true, optional = true}
quinn = {workspace = true, optional = true}
h3 = {workspace = true, optional = true}
h3-quinn = {workspace = true, optional = true}
rustls = {workspace = true, optional = true}
rustls-pemfile = {workspace = true, optional = true}
http-body = {workspace = true, optional = true}
http-body-util = {workspace = true, optional = true}
tower = {workspace = true, optional = true}
tracing = {workspace = true, optional = true}
# The runtime facade — r2e-rt is at the bottom of the graph, so r2e-http can
# reach it (see plans/runtime-http-dependency-containment.md §3).
r2e-rt = {workspace = true, optional = true}

[dev-dependencies]
tokio = {workspace = true, features = ["full"]}
criterion = {version = "0.8", default-features = false, features = ["cargo_bench_support"]}
sonic-rs = {workspace = true}
rcgen = {workspace = true}
tracing-subscriber = {workspace = true}
h3 = {workspace = true}
h3-quinn = {workspace = true}
quinn = {workspace = true}
rustls = {workspace = true}
http = {workspace = true}
http-body-util = {workspace = true}
tower = {workspace = true}

[[bench]]
name = "json"
harness = false
