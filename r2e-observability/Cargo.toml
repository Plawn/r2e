[package]
name = "r2e-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["opentelemetry", "tracing", "observability", "distributed-tracing"]
categories = ["web-programming"]
description = "OpenTelemetry observability plugin for R2E — distributed tracing and context propagation"

[features]
default = ["otlp"]
otlp = ["opentelemetry-otlp"]

[dependencies]
r2e-core = {workspace = true}
opentelemetry = {workspace = true}
opentelemetry_sdk = {workspace = true, features = ["rt-tokio"]}
opentelemetry-otlp = {workspace = true, optional = true}
opentelemetry-semantic-conventions = {workspace = true}
tracing-opentelemetry = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["json", "registry"]}
tower = {workspace = true}
http = {workspace = true}
pin-project-lite = {workspace = true}
reqwest = {workspace = true}
reqwest-middleware = {workspace = true}
reqwest-tracing = {workspace = true, features = ["opentelemetry_0_32"]}
async-trait = {workspace = true}
url = {workspace = true}

[dev-dependencies]
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"]}
opentelemetry_sdk = {workspace = true, features = ["testing"]}
tower = {workspace = true, features = ["util"]}
http-body-util = {workspace = true}
serde_json = {workspace = true}
