[package]
name = "r2e-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["scheduler", "cron", "background-tasks"]
categories = ["asynchronous"]
description = "Background task scheduler for R2E - interval, cron, and delayed task execution"

[dependencies]
r2e-core = {workspace = true}
r2e-executor = {workspace = true}
futures-util = {workspace = true}
cron = {workspace = true}
chrono = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
# `test-util` feeds `#[r2e::test(start_paused = true)]` in tests/scheduler/core.rs;
# an isolated `cargo test -p r2e-scheduler` has no other crate enabling it.
r2e-core = {workspace = true, features = ["test-util"]}
tokio = {workspace = true, features = ["full"]}
# tests/driver_edge_test/panics.rs captures the `r2e::panic` log line.
tracing-subscriber = {workspace = true}

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
