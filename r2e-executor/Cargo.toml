[package]
name = "r2e-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["executor", "task-pool", "async", "background-tasks"]
categories = ["asynchronous"]
description = "Managed task pool executor for R2E - injectable, bounded, with graceful shutdown"

[dependencies]
r2e-core = {workspace = true}
r2e-macros = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
tokio = {workspace = true, features = ["full", "test-util"]}
# tests/panic.rs captures the `r2e::panic` log line with a test subscriber.
tracing-subscriber = {workspace = true}
# `#[derive(BackgroundService)]` still emits `::tokio_util::sync::CancellationToken`
# into user code (flipped in phase 2e/2f), so the derive tests need it linked.
tokio-util = {workspace = true}
