[package]
name = "r2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Quarkus-like ergonomic layer over Axum — declarative controllers, compile-time DI, and zero runtime reflection"

[features]
default = ["security", "events", "utils"]
full = ["security", "events", "utils", "scheduler", "executor", "cache", "rate-limit", "openapi", "oidc", "prometheus", "openfga", "observability", "ws", "multipart", "grpc", "grpc-reflection", "static", "tenant", "mcp"]
security = ["dep:r2e-security"]
events = ["dep:r2e-events"]
utils = ["dep:r2e-utils"]
# Compatibility marker: pagination now lives in r2e-core and is always available.
data = []
data-sqlx = ["dep:r2e-data-sqlx"]
data-diesel = ["dep:r2e-data-diesel"]
sqlx-sqlite = ["data-sqlx", "r2e-data-sqlx/sqlite"]
sqlx-postgres = ["data-sqlx", "r2e-data-sqlx/postgres"]
sqlx-mysql = ["data-sqlx", "r2e-data-sqlx/mysql"]
diesel-sqlite = ["data-diesel", "r2e-data-diesel/sqlite"]
diesel-postgres = ["data-diesel", "r2e-data-diesel/postgres"]
diesel-mysql = ["data-diesel", "r2e-data-diesel/mysql"]
# Per-tenant SQLx pools/transactions: r2e-tenant + the sqlx backend's tenant impl.
tenant-sqlx = ["tenant", "data-sqlx", "r2e-data-sqlx/tenant"]
# Per-tenant Diesel pools/transactions: r2e-tenant + the diesel backend's tenant impl.
tenant-diesel = ["tenant", "data-diesel", "r2e-data-diesel/tenant"]
# Compatibility aliases. Prefer backend-qualified driver features above.
sqlite = ["sqlx-sqlite"]
postgres = ["sqlx-postgres"]
mysql = ["sqlx-mysql"]
events-iggy = ["events", "dep:r2e-events-iggy"]
events-kafka = ["events", "dep:r2e-events-kafka"]
events-pulsar = ["events", "dep:r2e-events-pulsar"]
events-rabbitmq = ["events", "dep:r2e-events-rabbitmq"]
scheduler = ["dep:r2e-scheduler", "executor"]
executor = ["dep:r2e-executor"]
cache = ["dep:r2e-cache"]
rate-limit = ["dep:r2e-rate-limit"]
oidc = ["dep:r2e-oidc"]
openapi = ["dep:r2e-openapi"]
prometheus = ["dep:r2e-prometheus"]
openfga = ["dep:r2e-openfga"]
observability = ["dep:r2e-observability"]
grpc = ["dep:r2e-grpc", "r2e-security?/grpc"]
mcp = ["dep:r2e-mcp"]
# MCP test helpers (`r2e::r2e_mcp::testing::pin_mcp_validator`). Dev-graph
# only (pulls r2e-test) — enable it from [dev-dependencies], not [dependencies].
mcp-testing = ["mcp", "r2e-mcp/testing"]
grpc-reflection = ["grpc", "r2e-grpc/reflection"]
static = ["dep:r2e-static"]
tenant = ["dep:r2e-tenant"]
ws = ["r2e-core/ws"]
multipart = ["r2e-core/multipart"]
json-sonic = ["r2e-core/json-sonic"]
# NOTE: quic is intentionally NOT in `full` — pulls heavy crypto deps (quinn, rustls, h3)
quic = ["r2e-core/quic"]
# NOTE: dev-reload is intentionally NOT in `full` — never include in production builds
dev-reload = ["dep:r2e-devtools", "r2e-core/dev-reload"]
# Paused clocks for `#[r2e::main(start_paused = true)]` / `#[r2e::test(...)]`.
# NOT in `full`: `tokio/test-util` changes timer behaviour, and feature
# unification would leak it into production builds. `r2e-test` turns it on, so
# a crate that depends on r2e-test gets it in its dev graph only.
test-util = ["r2e-core/test-util"]

[dependencies]
r2e-core = {workspace = true}
r2e-macros = {workspace = true}
r2e-security = {workspace = true, optional = true}
r2e-events = {workspace = true, optional = true}
r2e-utils = {workspace = true, optional = true}
r2e-data-sqlx = {workspace = true, optional = true}
r2e-data-diesel = {workspace = true, optional = true}
r2e-scheduler = {workspace = true, optional = true}
r2e-executor = {workspace = true, optional = true}
r2e-cache = {workspace = true, optional = true}
r2e-rate-limit = {workspace = true, optional = true}
r2e-oidc = {workspace = true, optional = true}
r2e-openapi = {workspace = true, optional = true}
r2e-prometheus = {workspace = true, optional = true}
r2e-openfga = {workspace = true, optional = true}
r2e-grpc = {workspace = true, optional = true}
r2e-mcp = {workspace = true, optional = true}
r2e-static = {workspace = true, optional = true}
r2e-tenant = {workspace = true, optional = true}
r2e-observability = {workspace = true, optional = true}
r2e-events-iggy = {workspace = true, optional = true}
r2e-events-kafka = {workspace = true, optional = true}
r2e-events-pulsar = {workspace = true, optional = true}
r2e-events-rabbitmq = {workspace = true, optional = true}
r2e-devtools = {workspace = true, optional = true}
