# Task placement must go through the `r2e-rt` runtime facade — as `r2e_rt::` or
# through the `r2e_core::rt` re-export — so the control-plane / data-plane split
# holds under sharded serving (`server.workers`, see
# docs/features/19-sharded-serving.md). Raw tokio spawns land on whatever
# runtime is current — on a sharded worker thread that is the wrong one.
# The only exemptions are the `#[expect]`-marked wrappers in r2e-rt/src/lib.rs.
#
# Runtime-neutral primitives (tokio::sync, tokio::time, select!) are NOT
# denied: they place no task, so control-plane routing does not concern them.
disallowed-methods = [
    { path = "tokio::spawn", reason = "use r2e_rt::spawn / r2e_core::rt::spawn (or rt::spawn_ctl for control-plane work)" },
    { path = "tokio::task::spawn", reason = "use r2e_rt::spawn / r2e_core::rt::spawn (or rt::spawn_ctl for control-plane work)" },
    { path = "tokio::task::spawn_blocking", reason = "use r2e_rt::spawn_blocking / r2e_core::rt::spawn_blocking" },
    { path = "tokio::task::spawn_local", reason = "no r2e-rt equivalent — spawn_local breaks the Send contract sharded serving relies on" },
    { path = "tokio::runtime::Handle::spawn", reason = "use r2e_rt::spawn_ctl / r2e_core::rt::spawn_ctl" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use r2e_rt::spawn_blocking / r2e_core::rt::spawn_blocking" },
]
