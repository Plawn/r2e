# Edition-2024 regression tests for the `#[routes]` codegen.
#
# Under edition 2024 a return-position `impl Trait` captures every lifetime in
# scope, `&self` included — so an ordinary handler returning one cannot have its
# value moved out into the response, and every route in this crate would fail to
# compile if `#[routes]` re-emitted it verbatim. The automatic `+ use<...>`
# clause (`r2e_macros::codegen::precise_capture`) is what keeps them compiling.
#
# The whole workspace is edition 2024, so nothing here is special-cased; this
# crate exists to pin the rewrite's *shape* — the cases it must cover (a bare
# stream, one nested a generic argument deep, an explicit clause it must not
# duplicate) and the case it must leave alone (`#[request_helper]`, where
# borrowing from the receiver is legitimate). The compile is the assertion.
[package]
name = "r2e-edition2024-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
r2e = {workspace = true, features = ["full"]}
futures-core = {workspace = true}
tokio = {workspace = true, features = ["full"]}
