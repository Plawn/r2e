name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check member crates inherit the workspace version
        run: |
          bad=$(grep -rl --include=Cargo.toml '^version *= *"' . \
                | sed 's|^\./||' \
                | grep -v -e '^Cargo.toml$' -e '^vendor/' -e '^examples/' -e '^target/' || true)
          if [ -n "$bad" ]; then
            echo "These member crates declare their own version instead of 'version.workspace = true':"
            echo "$bad"
            exit 1
          fi

      - name: Read workspace version
        id: workspace
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${version}"

      # The tag series follows the workspace version: vX.Y.* is the
      # compatibility series declared in Cargo.toml, the patch is a monotone
      # release counter within it. Bumping major/minor in Cargo.toml starts a
      # new series (its first tag uses the declared patch as-is).
      - name: Compute next tag in the workspace series
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.workspace.outputs.version }}"
          series="${major}.${minor}"
          git fetch --tags origin
          last=$(git tag -l "v${series}.*" --sort=-version:refname | head -n1)
          if [ -z "$last" ]; then
            new_version="${series}.${patch}"
          else
            last_patch="${last##*.}"
            new_version="${series}.$((last_patch + 1))"
          fi
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "Next tag: v${new_version} (series v${series}, last tag in series: ${last:-none})"

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags origin
          latest_tag=$(git tag -l 'v*' --sort=-version:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            log=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            log=$(git log --pretty=format:"- %s (%h)" "${latest_tag}..HEAD")
          fi
          {
            echo "log<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag ${{ steps.bump.outputs.tag }}
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.log }}
          generate_release_notes: false
