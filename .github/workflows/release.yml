name: Release

# A release is a change of one or more crate versions on master — made by
# scripts/bump-version.sh in a `release: …` PR. Crates are versioned
# independently (scripts/versions.py): only the crates whose version changed are
# published, each gets its own tag `<crate>-vX.Y.Z` and its own GitHub release
# built from its CHANGELOG section. Every other push is a no-op here.
#
# It runs after the Tests workflow succeeds on the pushed commit, so nothing is
# published from a red tree. Order: publish to crates.io, then tag each crate on
# that exact commit and create its GitHub release. Tags come last on purpose:
# "<crate>-vX.Y.Z exists" means "that crate's release is complete".
#
# A failed publish is resumed by re-running this workflow run ("Re-run failed
# jobs"): it runs on the same commit, publish-crates.sh skips every crate
# already on crates.io at its version, and already-tagged crates are skipped by
# "Decide". Do not release from a later commit — the run refuses to.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  # crates.io trusted publishing (OIDC) — see the "Authenticate" step.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # A plain version release fits in minutes. The margin covers a release that
    # adds new crate names, which crates.io rate-limits (see publish-crates.sh).
    timeout-minutes: 300
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      # edition and rust-version are single-sourced in [workspace.package]. A
      # member that spells one out drifts silently: a crate ships under an
      # edition/MSRV nobody verified. (Versions are per crate — checked below.)
      - name: Check member crates inherit edition and MSRV
        run: |
          status=0
          for key in edition rust-version; do
            bad=$(grep -rl --include=Cargo.toml "^${key} *= *\"" . \
                  | sed 's|^\./||' \
                  | grep -v -e '^Cargo.toml$' -e '^vendor/' -e '^examples/' -e '^target/' || true)
            if [ -n "$bad" ]; then
              echo "These member crates declare their own ${key} instead of '${key}.workspace = true':"
              echo "$bad"
              status=1
            fi
          done
          exit $status

      - name: Check the versioning invariants
        run: scripts/check-versions.sh

      # The crates to release: version changed against the first parent (the
      # previous master) and `<crate>-v<version>` not tagged yet. A crate whose
      # version is untagged but unchanged means an earlier release did not
      # finish and master moved on since: publishing it from this newer tree
      # would ship bytes that do not match what was already uploaded — the step
      # fails and names it.
      - name: Decide
        id: decide
        run: |
          python3 scripts/versions.py decide | tee "$RUNNER_TEMP/release.json"
          count=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['release']))" "$RUNNER_TEMP/release.json")
          if [ "$count" = "0" ]; then
            echo "No crate version changed — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            summary=$(python3 -c "import json,sys; print(', '.join(f\"{c['name']} {c['version']}\" for c in json.load(open(sys.argv[1]))['release']))" "$RUNNER_TEMP/release.json")
            echo "Releasing: $summary"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
          fi

      # Same native deps and disk budget as the Tests job: the publish preflight
      # checks the whole workspace on stable, and `cargo publish` verifies every
      # crate by building it.
      - name: Free disk space
        if: steps.decide.outputs.release == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install native build deps
        if: steps.decide.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libcurl4-openssl-dev zlib1g-dev libssl-dev \
            libsqlite3-dev libpq-dev

      # The published crates must build on stable; rust-toolchain.toml's
      # nightly is still installed for the cargo metadata calls.
      - name: Install toolchains
        if: steps.decide.outputs.release == 'true'
        run: |
          rustup show
          rustup toolchain install stable --profile minimal

      # Restore master's Tests cache (never save: this job would evict it).
      - uses: Swatinem/rust-cache@v2
        if: steps.decide.outputs.release == 'true'
        with:
          save-if: false

      # One notes file per released crate, from its CHANGELOG `## [X.Y.Z]`
      # section. Fails before anything is uploaded when a section is empty.
      - name: Extract release notes
        if: steps.decide.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          python3 -c "import json,sys; [print(c['name'], c['version']) for c in json.load(open(sys.argv[1]))['release']]" "$RUNNER_TEMP/release.json" \
          | while read -r name version; do
              python3 scripts/versions.py notes "$name" "$version" > "$RUNNER_TEMP/notes/$name.md" \
                || { echo "::error::$name/CHANGELOG.md has no non-empty '## [$version]' section — run scripts/bump-version.sh"; exit 1; }
            done

      # Trusted publishing when no CARGO_REGISTRY_TOKEN secret is set: every
      # crate must list this repo + release.yml as a trusted publisher on
      # crates.io. The token it mints lives 30 minutes.
      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        if: steps.decide.outputs.release == 'true' && env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.decide.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --yes --resume

      # Tag + GitHub release per crate, on the exact commit that was published.
      # `gh release create` creates the tag; a crate already tagged (a previous
      # partial run) was skipped by "Decide", so this never re-tags.
      - name: Tag and create the GitHub releases
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json,sys; [print(c['name'], c['version'], c['tag']) for c in json.load(open(sys.argv[1]))['release']]" "$RUNNER_TEMP/release.json" \
          | while read -r name version tag; do
              gh release create "$tag" \
                --target '${{ github.event.workflow_run.head_sha }}' \
                --title "$name v$version" \
                --notes-file "$RUNNER_TEMP/notes/$name.md"
            done

      # The release is complete; now build what a user builds. A throwaway app
      # depending on the facade from crates.io alone — no `[patch]`, no path
      # dependency — with a validated `#[routes]` handler and an
      # `#[mcp_routes]` tool must compile on stable. The workspace is always
      # built from source, so a crate a release left behind on crates.io is
      # invisible to every other job (#1092: r2e 0.7/0.8 failed every registry
      # build while `cargo test --workspace` stayed green). A failure here is
      # red on a finished release: cut a fix release, nothing is rolled back.
      - name: Smoke-build against crates.io
        if: steps.decide.outputs.release == 'true'
        env:
          SMOKE_TOOLCHAIN: stable
        run: scripts/smoke-registry.sh
