name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info is dead weight on CI and dominates the target-dir size on the
  # 14 GB runner disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Select affected crates
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      run: ${{ steps.select.outputs.run }}
    steps:
      # Version validation needs the release tags and their full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test CI selection policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # Keep version/release validation unconditional, including prose-only PRs.
      - name: scripts/check-versions.sh
        run: scripts/check-versions.sh

      - name: Select changed crates and their consumers
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_affected.py plan --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  test:
    name: cargo test
    needs: changes
    # A failed planner must fail the existing required check, not skip it.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - name: Require successful change analysis
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4

      # A full-workspace test build (every backend, every example) does not fit
      # next to the preinstalled SDKs on the stock runner image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # tonic-prost-build shells out to `protoc` (r2e-grpc-build, example-grpc,
      # r2e-compile-tests); `libprotobuf-dev` carries the well-known-type
      # `.proto` includes that prost-wkt-types compiles against. librdkafka
      # (r2e-events-kafka, static cmake build) needs the curl / zlib / ssl
      # headers; cmake itself the image already ships. `llm-doctests` compiles
      # the diesel snippets with the `sqlite` + `postgres` backends, which link
      # libsqlite3 / libpq.
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libcurl4-openssl-dev zlib1g-dev libssl-dev \
            libsqlite3-dev libpq-dev

      # The runner ships rustup; `rustup show` installs whatever
      # `rust-toolchain.toml` pins (the nightly the trybuild `.stderr`
      # expectations are blessed on), so the pin lives in one place.
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup show
          cargo --version

      # Only master writes the cache: PR runs restore it but never save, so
      # branch caches cannot evict master's from the 10 GB repo quota (a cold
      # workspace build costs ~6 min).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # trybuild runs in its own step below (so a `.stderr` drift is named in
      # the job summary); excluding it here keeps it from running twice.
      # PRs select affected packages; master/manual runs keep --workspace.
      - name: cargo test (affected crates or full workspace)
        run: python3 scripts/ci_affected.py run test

      # `dev-reload` is off by default and changes `run()`'s serving path
      # (single cached listener, sharding refused); `mark_hot_reload_loop()`
      # is process-global, hence its own target. A green default-feature run
      # says nothing about these.
      - name: cargo check -p r2e-core --features dev-reload --all-targets
        if: fromJSON(env.CI_PLAN).dev_reload
        run: cargo check -p r2e-core --features dev-reload --all-targets

      - name: cargo test -p r2e-core --features dev-reload --test runtime
        if: fromJSON(env.CI_PLAN).dev_reload
        run: cargo test -p r2e-core --features dev-reload --test runtime

      - name: cargo test -p r2e-core --features dev-reload --test dev_reload
        if: fromJSON(env.CI_PLAN).dev_reload
        run: cargo test -p r2e-core --features dev-reload --test dev_reload

      # Excluded from `--workspace` above; its own leg so a trybuild
      # `.stderr` drift is named in the job summary rather than buried.
      - name: compile-tests (trybuild)
        if: fromJSON(env.CI_PLAN).compile_tests
        run: python3 scripts/ci_affected.py run compile-tests

  # A declared MSRV that nothing builds against is a guess. This job reads
  # `rust-version` from [workspace.package] and checks the workspace on exactly
  # that toolchain, so raising the floor is a deliberate edit rather than
  # something a `cargo update` does behind our back.
  msrv:
    name: cargo check on the declared MSRV
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - name: Require successful change analysis
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libcurl4-openssl-dev zlib1g-dev libssl-dev \
            libsqlite3-dev libpq-dev

      - name: Install the declared MSRV toolchain
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$msrv" ]; then
            echo "Could not read rust-version from [workspace.package]" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"
          echo "MSRV: ${msrv}"

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: msrv-${{ steps.msrv.outputs.version }}

      # The explicit `+<toolchain>` overrides `rust-toolchain.toml`, which pins
      # the nightly the trybuild `.stderr` expectations are blessed on.
      - name: cargo check on MSRV (affected crates or full workspace)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: python3 scripts/ci_affected.py run msrv --toolchain "$MSRV"
